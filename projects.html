<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="assets/css/style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700;800&display=swap"
			rel="stylesheet" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
		<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

		<title>Tazriyan Sirat</title>
	</head>
	<body>
		<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
			<div class="container">
				<a class="navbar-brand fw-bold fs-3" href="index.html"> TS. </a>

				<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbar">
					<span class="navbar-toggler-icon"></span>
				</button>

				<div class="collapse navbar-collapse" id="navbar">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item">
							<a class="nav-link" href="index.html"> Home </a>
						</li>

						<li class="nav-item">
							<a class="nav-link active" href="projects.html"> Projects </a>
						</li>
					</ul>
				</div>
			</div>
		</nav>

		<!-- Hero Section -->
		<section class="project-hero">
			<div class="container text-center">
				<h1 class="display-2 fw-bold">My Projects</h1>

				<p class="lead text-secondary">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
			</div>
		</section>

		<!-- Projects Section -->
		<section class="py-5">
			<div class="container">
				<!-- Filter Buttons -->

				<div class="d-flex justify-content-center flex-wrap gap-2 mb-5">
					<button class="btn btn-primary filter-btn" data-filter="All">All</button>

					<button class="btn btn-outline-primary filter-btn" data-filter="Power BI">Power BI</button>

					<button class="btn btn-outline-primary filter-btn" data-filter="Python">Python</button>

					<button class="btn btn-outline-primary filter-btn" data-filter="SQL">SQL</button>

					<button class="btn btn-outline-primary filter-btn" data-filter="Excel">Excel</button>
				</div>

				<div id="projects-container" class="row g-4"></div>
			</div>
		</section>

		<!-- Bootstrap modal for project details -->
		<div class="modal fade" id="projectModal" tabindex="-1">
			<div class="modal-dialog modal-xl modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h3 class="modal-title" id="modalTitle"></h3>

						<button class="btn-close" data-bs-dismiss="modal"></button>
					</div>

					<div class="modal-body">
						<img id="modalImage" class="img-fluid rounded mb-4" />

						<p id="modalDescription"></p>

						<h5 class="mt-4">Problem</h5>

						<p id="modalProblem"></p>

						<h5 class="mt-4">Solution</h5>

						<p id="modalSolution"></p>

						<h5 class="mt-4">Key Insights</h5>

						<ul id="modalInsights"></ul>

						<div id="modalTech" class="my-4"></div>

						<a id="githubBtn" target="_blank" class="btn btn-dark me-2"> GitHub </a>

						<a id="liveBtn" target="_blank" class="btn btn-primary"> Live Demo </a>
					</div>
				</div>
			</div>
		</div>

		<!-- Footer -->
		<footer class="bg-dark text-white py-5">
			<div class="container text-center">
				<h4>Tazriyan Sirat</h4>

				<p>Lorem ipsum dolor sit amet.</p>

				<div class="my-4">
					<a href="#" class="text-white me-3">
						<i class="bi bi-linkedin fs-4"></i>
					</a>

					<a href="#" class="text-white me-3">
						<i class="bi bi-github fs-4"></i>
					</a>

					<a href="#" class="text-white">
						<i class="bi bi-envelope-fill fs-4"></i>
					</a>
				</div>

				<p class="mb-0">© 2026 All Rights Reserved.</p>
			</div>
		</footer>

		<!-- Back to Top Button -->
		<button id="topBtn">
			<i class="bi bi-arrow-up"></i>
		</button>

		<!-- Custom JS -->
		<script src="assets/js/script.js"></script>

		<!-- Bootstrap Bundle with Popper -->
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"></script>
		<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

		<!-- EmailJS Initialization -->
		<script type="text/javascript">
			(function () {
				emailjs.init({
					publicKey: "uXOeYAky9LtqQR_EG",
				});
			})();
		</script>

		<!-- AOS Animation -->
		<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

		<!-- Initialize AOS -->
		<script>
			AOS.init({
				duration: 900,
				once: true,
			});
		</script>
	</body>
</html>
